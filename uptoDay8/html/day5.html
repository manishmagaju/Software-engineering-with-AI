<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>visa card</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="flex justify-center items-center bg-gray-300 h-screen">
    <form action="" class=" w-2/4 bg-green-500 shadow-3xl p-6 rounded-3xl">
        <div class=" ">
            <img class="" src="images/visa.jpeg" alt="">
        </div>
        <div class="flex flex-col justify-between">
            <div class="flex flex-col py-1">
                <label for="card">Card Number</label>
                <input id="card" class="" type="text">
            </div>
            <div class="flex flex-col py-1">
                <label for="">Card Holder</label>
                <input type="text">
            </div>
            <div class="flex justify-between">
                <div class="flex flex-col justify-end">
                    <label for="">Expiration Date</label>
                    <input type="text">
                </div>
                <div class="flex  items-end">
                    <input type="year" class="h-fit">
                </div>
                <div class="flex flex-col gap-2 py-1">
                    <label for="">Cvv</label>
                    <input type="num">
                </div>
            </div>
            <button class="bg-blue-500 rounded mt-5 py-2">Submit</button>
        </div>
    </form>


</body>

</html>
